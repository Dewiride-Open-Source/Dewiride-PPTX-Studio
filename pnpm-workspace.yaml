packages:
  - 'packages/*'
  - 'apps/*'

# --- supply chain -----------------------------------------------------------
# pnpm 11 defaults, restated explicitly so a future default change is visible
# in the diff rather than silent. See docs/adr/phase-0-foundation/0001-toolchain.md.
minimumReleaseAge: 1440
blockExoticSubdeps: true
verifyDepsBeforeRun: install

# Postinstall scripts are deny-by-default in pnpm 11, and pnpm refuses to install
# until each package it flags is decided. Neither of these has an install-time
# script, so the reviewed answer is no. ADR 0060.
allowBuilds:
  '@vitest/browser-playwright': false
  playwright: false

# --- shared versions --------------------------------------------------------
# Nothing in packages/ or tools/ pins a shared version itself; everything says
# `catalog:`. The protocol is rewritten to a concrete range on publish/pack.
catalog:
  # runtime
  fflate: ^0.8.3

  # language + build
  typescript: 6.0.3
  tsdown: 0.23.0
  turbo: 2.11.4

  # lint + format
  eslint: 10.11.0
  '@eslint/js': ^10.0.1
  globals: ^17.12.0
  typescript-eslint: 8.70.1
  '@typescript-eslint/parser': 8.70.1
  eslint-config-prettier: 10.1.8
  prettier: 3.9.9

  # test
  vitest: 5.0.2
  '@vitest/browser-playwright': 5.0.2
  '@vitest/ui': 5.0.2
  vite: 8.2.2
  playwright: 1.63.0

  # package QA + release
  publint: 0.3.24
  '@arethetypeswrong/cli': 0.18.5
  '@changesets/cli': 3.0.3

  # tooling
  yaml: ^2.9.1

  # types
  '@types/node': ^26.6.3
