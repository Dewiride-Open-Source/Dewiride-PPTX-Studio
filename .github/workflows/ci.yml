name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags. A tag is mutable; a compromised
# upstream can move v4 and every workflow that references it runs new code.
env:
  # Determinism beats freshness in CI: a package published in the last day has
  # not had time to be caught, and a lockfile-driven install should not be
  # resolving anything anyway.
  CI: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `persist-credentials: false` because nothing here pushes. By default
      # `checkout` leaves the token in `.git/config`, where every later step -
      # and everything those steps install - can read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cheapest first, and the one that fails most usefully: a layering
      # violation is a design problem, not a typo, and there is no point
      # spending four minutes on Chromium to find out afterwards.
      - name: Layering
        run: pnpm layering

      # Second, and before Format, on purpose. It needs no build and no
      # Chromium, and ordering a legal gate behind a whitespace gate means a
      # run that stops on formatting never reports that a fixture has no
      # licence.
      - name: Corpus provenance
        run: pnpm corpus

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Package QA (publint + are-the-types-wrong)
        run: pnpm pkg:qa

      # The core suite runs in real Chromium, not jsdom. Under jsdom a `node:*`
      # import resolves and the leak stays invisible until a user opens a tab.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

  # The one record a runner is allowed to make, and it is not a gate.
  #
  # `pnpm fidelity` gates the SHA-256 of our own raster against a baseline
  # recorded per platform, and a baseline has to be recorded on the platform it
  # gates. Only `expected.win32-x64.json` exists, so this job exists to write
  # `expected.linux-x64.json` once, by hand, on the runner CI actually uses.
  #
  # It never runs on a push or a pull request, it uploads rather than commits,
  # and `--bootstrap` is refused the moment a baseline for the platform exists -
  # so this cannot become the thing that turns a red gate green. A person
  # downloads the artifact, reads it, and commits it; that commit is the review.
  #
  # Both files are uploaded because `--record` also claims the new fixture in
  # `corpus/ground-truth/manifest.json`, and `pnpm corpus` refuses a file under
  # `corpus/` that no entry claims.
  record-fidelity-baseline:
    name: record the linux fidelity baseline
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The harness loads the packages as built ESM through an import map, so
      # there has to be a `dist`.
      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Refuses outright if a linux-x64 baseline is already committed.
      - name: Record
        run: pnpm fidelity --record --bootstrap

      - name: Report
        run: cat fidelity/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fidelity-baseline-linux-x64
          path: |
            corpus/ground-truth/render/fidelity/expected.linux-x64.json
            corpus/ground-truth/manifest.json
          if-no-files-found: error

  # Phase 1's whole claim, on its own, in about a minute.
  #
  # `check` already asserts it from source - `tools/corpus/roundtrip/roundtrip.test.ts`
  # runs under `pnpm test`. So this job gates nothing that was not gated
  # already, and it is still worth its minute:
  # it is the number the README carries, and putting it behind a Chromium
  # install means the one result anybody wants from a pull request arrives last.
  # Same reasoning that already puts `layering` and `corpus` first inside
  # `check`, applied one level up.
  #
  # No Chromium and no full build: four packages, `node`, fifty-one decks.
  roundtrip:
    name: round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only what the round trip needs: opc, xml, validate, writer. Nothing
      # links workspace packages into `tools/`, so the script loads the writer
      # from `dist` and there has to be a `dist`.
      - name: Build the writer
        run: pnpm turbo run build --filter=@pptx-studio/writer...

      # Writes the per-collection table to the job summary, and fails if the
      # committed badge does not say what this run just measured.
      - name: Round trip the corpus
        run: pnpm roundtrip
