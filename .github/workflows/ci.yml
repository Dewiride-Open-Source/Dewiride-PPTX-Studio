name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs, not tags. A tag is mutable; a compromised
# upstream can move v4 and every workflow that references it runs new code.
env:
  # Determinism beats freshness in CI: a package published in the last day has
  # not had time to be caught, and a lockfile-driven install should not be
  # resolving anything anyway.
  CI: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `persist-credentials: false` because nothing here pushes. By default
      # `checkout` leaves the token in `.git/config`, where every later step -
      # and everything those steps install - can read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Cheapest first, and the one that fails most usefully: a layering
      # violation is a design problem, not a typo, and there is no point
      # spending four minutes on Chromium to find out afterwards.
      - name: Layering
        run: pnpm layering

      # Second, and before Format, on purpose. It needs no build and no
      # Chromium, and ordering a legal gate behind a whitespace gate means a
      # run that stops on formatting never reports that a fixture has no
      # licence.
      - name: Corpus provenance
        run: pnpm corpus

      # The other legal gate: a published tarball has to carry the licence and
      # the NOTICE, and neither is something a test would ever notice missing.
      - name: Legal
        run: pnpm legal

      - name: Structure
        run: pnpm structure

      - name: References
        run: pnpm references

      - name: Format
        run: pnpm format:check

      # Before Lint and Typecheck, and not after them. Both are type-aware and
      # resolve a workspace package through its `exports` to `dist/index.d.ts`,
      # so on a clean checkout they see an unresolvable type rather than a real
      # one and report every use of it as `any`.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Package QA (publint + are-the-types-wrong)
        run: pnpm pkg:qa

      # The core suite runs in real Chromium, not jsdom. Under jsdom a `node:*`
      # import resolves and the leak stays invisible until a user opens a tab.
      # The fidelity gate and Gate 2 need the same browser, so they share it.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The SHA-256 of our own raster against `expected.linux-x64.json`. It
      # stops rather than scores if this runner's fonts or browser have moved
      # from the ones the baseline was recorded through.
      - name: Fidelity
        run: pnpm fidelity

      - name: Gate 2
        run: pnpm gate2

      - name: Test
        run: pnpm test

  # The one record a runner is allowed to make, and it is not a gate.
  #
  # `pnpm fidelity` gates the SHA-256 of our own raster against a baseline
  # recorded per platform, and a baseline has to be recorded on the platform it
  # gates. This job is how a platform gets its first one - it wrote
  # `expected.linux-x64.json` on the runner CI actually uses, and it is what any
  # later platform would be bootstrapped with.
  #
  # It never runs on a push or a pull request, it uploads rather than commits,
  # and `--bootstrap` is refused the moment a baseline for the platform exists -
  # so this cannot become the thing that turns a red gate green. A person
  # downloads the artifact, reads it, and commits it; that commit is the review.
  #
  # Both files are uploaded because `--record` also claims the new fixture in
  # `corpus/ground-truth/manifest.json`, and `pnpm corpus` refuses a file under
  # `corpus/` that no entry claims.
  #
  # Once the baseline is committed there is nothing left to record, so the work
  # is skipped rather than attempted: `--bootstrap` would refuse it and a red run
  # would claim something was wrong. The check is a step and not the job's `if`,
  # because `hashFiles` is evaluated before the checkout and would see nothing.
  record-fidelity-baseline:
    name: record the linux fidelity baseline
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Does this platform have a baseline already?
        id: baseline
        run: |
          if [ -f corpus/ground-truth/render/fidelity/expected.linux-x64.json ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'linux-x64 has a committed baseline; nothing to record.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.baseline.outputs.needed == 'true'
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.baseline.outputs.needed == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.baseline.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      # The harness loads the packages as built ESM through an import map, so
      # there has to be a `dist`.
      - name: Build
        if: steps.baseline.outputs.needed == 'true'
        run: pnpm build

      - name: Install Chromium
        if: steps.baseline.outputs.needed == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Refuses outright if a linux-x64 baseline is already committed, so the
      # step above is a courtesy and this is the actual lock.
      - name: Record
        if: steps.baseline.outputs.needed == 'true'
        run: pnpm fidelity --record --bootstrap

      - name: Report
        if: steps.baseline.outputs.needed == 'true'
        run: cat fidelity/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.baseline.outputs.needed == 'true'
        with:
          name: fidelity-baseline-linux-x64
          path: |
            corpus/ground-truth/render/fidelity/expected.linux-x64.json
            corpus/ground-truth/manifest.json
          if-no-files-found: error

  # The one job that resolves `@pptx-studio/*` through package boundaries.
  #
  # Everything else here reads the working tree: `check` resolves through the
  # pnpm link farm, and `pkg:qa` reads a tarball's manifest without installing
  # or executing it. So nothing else can tell whether what would be published is
  # usable, and 0.1.0 reached npm having never been installed anywhere.
  #
  # This packs the candidates, installs them into a scratch consumer with the
  # scope pointed at a dead registry, refuses any resolution that did not come
  # from one of this run's tarballs, and then runs the example against them.
  # Hermetic: it depends on the commit and never on what is already published,
  # which is what lets the release gate require it. ADR 0046.
  candidate:
    name: the packages this commit would publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm pack` ships whatever `dist` holds, so the build has to precede it.
      - run: pnpm build

      - name: Pack the candidates, install them, and consume them
        run: node tools/release/candidate/candidate.ts "$RUNNER_TEMP/candidate"

  # Phase 1's whole claim, on its own, in about a minute.
  #
  # `check` already asserts it from source - `tools/corpus/roundtrip/roundtrip.test.ts`
  # runs under `pnpm test`. So this job gates nothing that was not gated
  # already, and it is still worth its minute:
  # it is the number the README carries, and putting it behind a Chromium
  # install means the one result anybody wants from a pull request arrives last.
  # Same reasoning that already puts `layering` and `corpus` first inside
  # `check`, applied one level up.
  #
  # No Chromium and no full build: four packages, `node`, fifty-one decks.
  roundtrip:
    name: round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only what the round trip needs: opc, xml, validate, writer. Nothing
      # links workspace packages into `tools/`, so the script loads the writer
      # from `dist` and there has to be a `dist`.
      - name: Build the writer
        run: pnpm turbo run build --filter=@pptx-studio/writer...

      # Writes the per-collection table to the job summary, and fails if the
      # committed badge does not say what this run just measured.
      - name: Round trip the corpus
        run: pnpm roundtrip

  # ADR 0042 open questions 2 and 3, folded into one measurement.
  #
  # T13 has the font-table reader exact on seven fonts built to disagree with
  # themselves, which says nothing about a face nobody built: real faces bring
  # class-based GPOS kerning, GSUB ligatures and hmtx tables with thousands of
  # entries. This scores the shipped reader against `measureText` on the faces
  # this image carries, and prices the missing shaper on the same faces.
  #
  # Its own job rather than a step in `check`, for the reason `example` is its
  # own job: the font directories are a property of this image and are named on
  # the command line, so `pnpm check` on a laptop cannot run it - there the
  # system font directory is not ours to index. It reaches no registry.
  #
  # No font package is installed. What is measured has to be what the image
  # carries, or the number is a property of an apt line rather than of the
  # runner; a script no face on the image covers is recorded, and passes.
  real-faces:
    name: the font reader against Chromium, on real faces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The measurement scores the built reader, which is what an `npm install`
      # gets, so there has to be a `dist`, and it has to be this commit's:
      # `--force` because a replayed cache scores the previous reader. ADR 0052.
      - name: Build the CLI
        run: pnpm turbo run build --filter=@pptx-studio/cli... --force

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # A runner's own faces agree with themselves; T13's probes do not, so the
      # three tables are separated by 100 px on this rasteriser too.
      - name: Build the probe fonts
        run: node tools/ground-truth/fonts/metrics/build-fonts.ts "$RUNNER_TEMP/probe-fonts"

      # `--font-dir` is required and there is no system fallback, so a directory
      # that moves fails here rather than quietly measuring nothing.
      - name: Measure
        run: >
          node tools/ground-truth/fonts/real-faces/measure-in-browser.ts
          "$RUNNER_TEMP/real-faces" --font-dir /usr/share/fonts
          --font-dir "$RUNNER_TEMP/probe-fonts"

      - name: Score
        run: >
          node tools/ground-truth/fonts/real-faces/analyse.ts
          "$RUNNER_TEMP/real-faces" --summary "$GITHUB_STEP_SUMMARY"

      # The numbers, whether or not the gate held: a red run is the one whose
      # measurement is worth reading. `warn` rather than `error`, because a
      # measure step that died before writing must not add a second failure.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: font-agreement
          path: ${{ runner.temp }}/real-faces
          if-no-files-found: warn

  # CoreText is measured by nobody, so this scores the DirectWrite reading the
  # reader assumes there. Dispatch only and gating nothing until its first
  # reading is on the record; expected red on `advance-quantum`. ADR 0052.
  real-faces-macos:
    name: the font reader against Chromium, on real faces, on macOS
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm turbo run build --filter=@pptx-studio/cli... --force

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the probe fonts
        run: node tools/ground-truth/fonts/metrics/build-fonts.ts "$RUNNER_TEMP/probe-fonts"

      # /System/Library/Fonts reaches Supplemental on its own; naming both
      # would index every face there twice and skip it as a collection.
      - name: Measure
        run: >
          node tools/ground-truth/fonts/real-faces/measure-in-browser.ts
          "$RUNNER_TEMP/real-faces" --font-dir /System/Library/Fonts
          --font-dir /Library/Fonts --font-dir "$RUNNER_TEMP/probe-fonts"

      - name: Score
        run: >
          node tools/ground-truth/fonts/real-faces/analyse.ts
          "$RUNNER_TEMP/real-faces" --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: font-agreement-macos
          path: ${{ runner.temp }}/real-faces
          if-no-files-found: warn

  # T13 is what every reader test re-derives, taken on one Windows 11 machine.
  # This re-takes it on a Windows runner and requires the fixture it writes to
  # be the committed one; the only free variable is DirectWrite. ADR 0052.
  probe-fonts:
    name: the font reader against Chromium, on the probe fonts
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        run: pnpm turbo run build --filter=@pptx-studio/cli... --force

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Measure
        run: node tools/ground-truth/fonts/metrics/measure-in-browser.ts "$RUNNER_TEMP/probe-fonts"

      - name: Score, into the committed fixture's path
        run: >
          node tools/ground-truth/fonts/metrics/analyse.ts "$RUNNER_TEMP/probe-fonts"
          --fixture corpus/ground-truth/font-metrics.json

      # The committed fixture is Prettier-formatted, so the comparison is too.
      - name: The fixture this runner would commit is the one that is committed
        run: |
          pnpm exec prettier --write corpus/ground-truth/font-metrics.json
          git diff --exit-code -- corpus/ground-truth/font-metrics.json

      - name: Run the suite that re-derives the reader from it
        run: pnpm exec vitest run --project cli

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: font-metrics-windows
          path: ${{ runner.temp }}/probe-fonts
          if-no-files-found: warn
