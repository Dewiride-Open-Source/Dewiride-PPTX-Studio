name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # changesets opens the version PR and pushes tags
      pull-requests: write
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Publishing goes through the npm CLI rather than `pnpm publish`.
      # pnpm 11 replaced the npm publish fallback with a native implementation
      # and OIDC trusted publishing that worked under pnpm 10 now 404s
      # (pnpm/pnpm#11513). Revisit when that is fixed.
      #
      # Do NOT set NODE_AUTH_TOKEN here: with a token present the npm CLI takes
      # the legacy token path and silently skips OIDC, which also means no
      # provenance attestation. Trusted publishing needs npm >= 11.5.1 and
      # `id-token: write` above, and nothing else.
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version: pnpm version-packages
          publish: npm exec -- changeset publish
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
