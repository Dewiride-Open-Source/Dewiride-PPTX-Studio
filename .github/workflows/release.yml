# Releases are dispatched by hand, never by a push. Every package with a
# pending changeset goes out at once and the version commit lands on main
# directly, so there is no release pull request to open or approve.
#
# `prove` installs from the registry and holds nothing to publish with; `publish` holds the
# right to publish, installs nothing, and publishes only the tarballs `prove` recorded. ADR 0059.
name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to release every package with a pending changeset'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prove:
    name: prove
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # to read whether CI passed on this commit
    outputs:
      commit: ${{ steps.packed.outputs.commit }}
      digest: ${{ steps.packed.outputs.digest }}
    steps:
      - name: Confirm
        if: inputs.confirm != 'publish' || github.ref_name != 'main'
        run: |
          echo "::error::release from main, with 'publish' typed in the confirm box"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Publishing cannot be undone, so a red commit must not reach the registry.
      #
      # Named jobs rather than the run's conclusion. A conclusion folds in every
      # job in the file, so one non-gating job can refuse every release - which
      # is what the registry canary did before it moved to canary.yml. A job
      # absent from this list cannot block a publish, and a job named here that
      # did not run is a failure rather than a pass. ADR 0046.
      - name: Require the gating jobs of CI to be green on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED: |
            check
            the packages this commit would publish
            round trip
            the font reader against Chromium, on real faces
            the font reader against Chromium, on the probe fonts
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs"
          id=$(gh api "$runs?head_sha=$GITHUB_SHA&status=completed&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::no completed CI run for $GITHUB_SHA; wait for one"
            exit 1
          fi
          got=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv')
          bad=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            was=$(printf '%s\n' "$got" | awk -F'\t' -v n="$name" '$1 == n { print $2 }')
            if [ -z "$was" ]; then
              echo "::error::CI run $id has no job named '$name'; this gate would pass vacuously"
              bad=1
            elif [ "$was" != "success" ]; then
              echo "::error::'$name' concluded '$was' on $GITHUB_SHA"
              bad=1
            fi
          done <<< "$REQUIRED"
          [ "$bad" -eq 0 ] || exit 1

      - name: Require a pending changeset
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "::error::nothing to release: no changeset in .changeset/"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The two gates that are about the tarball rather than the code.
      - run: pnpm legal
      - run: pnpm pkg:qa

      # A trusted publisher is a setting on an npm package and cannot be
      # attached to a name npm does not have yet, so a package's first publish
      # cannot go out over OIDC. Publishing goes one package at a time, so
      # finding that out halfway leaves a half-published release. Ask first.
      - name: Refuse to create a package npm does not have yet
        run: node tools/release/registry/newcomers.ts

      - name: Version
        run: pnpm version-packages

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: release'

      # Only now are the versions the ones that will be published, and only now
      # does `workspace:^` pack as the range a consumer will actually resolve.
      # Recorded and uploaded before the consumer installs anything, so nothing
      # the registry serves it can reach what `publish` is handed.
      - name: Pack the tarballs this release publishes
        id: packed
        run: |
          pnpm build
          node tools/release/candidate/candidate.ts "$RUNNER_TEMP/release" --pack-only
          git bundle create "$RUNNER_TEMP/release/version.bundle" origin/main..HEAD
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "digest=$(sha256sum "$RUNNER_TEMP/release/tarballs/packed.json" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ runner.temp }}/release/tarballs/
            ${{ runner.temp }}/release/version.bundle
          if-no-files-found: error

      # The last thing between the code and a registry that cannot be undone.
      - name: Consume the exact tarballs that are about to be published
        run: node tools/release/candidate/candidate.ts "$RUNNER_TEMP/release" --packed

  publish:
    name: publish
    needs: prove
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the version commit and its tags land on main directly
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse a main that moved while the release was proved
        env:
          PROVED: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$PROVED" ]; then
            echo "::error::main is $(git rev-parse HEAD), the release was proved on $PROVED"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Hold the artifact to what prove recorded before any consumer code ran
        env:
          COMMIT: ${{ needs.prove.outputs.commit }}
          DIGEST: ${{ needs.prove.outputs.digest }}
        run: |
          echo "$DIGEST  $RUNNER_TEMP/release/tarballs/packed.json" | sha256sum --check --strict
          git bundle verify "$RUNNER_TEMP/release/version.bundle"
          git fetch "$RUNNER_TEMP/release/version.bundle" HEAD
          if [ "$(git rev-parse FETCH_HEAD)" != "$COMMIT" ]; then
            echo "::error::the bundle holds $(git rev-parse FETCH_HEAD), prove committed $COMMIT"
            exit 1
          fi
          git merge --ff-only "$COMMIT"

      # npm trades an ID token for a publish token one package at a time, so a
      # package whose trusted publisher is missing fails partway through and
      # leaves the release half shipped. Ask for all of them first. ADR 0048.
      - name: Prove every package this release publishes can publish over OIDC
        run: node tools/release/registry/publishers.ts

      # NODE_AUTH_TOKEN stays unset: with a token the CLI takes the legacy path
      # and skips both OIDC and the provenance attestation with it. ADR 0001.
      - name: Publish the tarballs prove packed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node tools/release/registry/publish.ts "$RUNNER_TEMP/release/tarballs"

      # After the registry, so a failed publish leaves main untouched and the
      # next run is a clean retry.
      - name: Push the version commit and its tags
        run: git push --follow-tags origin HEAD:main
