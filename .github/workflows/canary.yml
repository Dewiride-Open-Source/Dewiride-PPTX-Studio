# What npm is actually serving, checked against the example that consumes it.
#
# This is a monitor, not a gate, and the distinction is the whole reason it is
# its own workflow. It installs `@pptx-studio/*` from the public registry, so
# its answer is a property of the world rather than of any commit: the same
# commit can be green today and red tomorrow with nobody touching it.
#
# It used to be a job inside `ci.yml`, where the release gate reads the run's
# conclusion. That deadlocked - the published packages were broken, so CI was
# red, so the release that would fix them was refused. A monitor wired into a
# gate socket can block the only thing that could ever repair it. ADR 0046.
#
# What the release gate requires instead is `candidate`, which proves the
# tarballs this commit would publish, and depends on nothing already published.
name: canary

on:
  schedule:
    # Daily. The published packages only change when a release runs, so this is
    # about the registry and the ecosystem around it, not about our cadence.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  published:
    name: the example, installed from npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # `latest` rather than the example's own ranges. A `^0.1.0` cannot resolve
      # to 0.2.0 - a caret below 1.0 is bounded by the minor - so a monitor that
      # honoured the manifest would keep reporting on the version the next
      # release replaces, and would need a hand-edit after every one.
      - name: Point every @pptx-studio dependency at what npm is serving
        working-directory: examples/nextjs-studio
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const name of Object.keys(p.dependencies)) {
              if (name.startsWith("@pptx-studio/")) p.dependencies[name] = "latest";
            }
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '

      # `--no-package-lock` is the point rather than a shortcut: a committed
      # lockfile would pin this to the day it was written and it would never be
      # a canary again.
      - name: Install from the registry
        working-directory: examples/nextjs-studio
        run: npm install --no-package-lock --no-fund --no-audit

      # Real directories, not symlinks. If pnpm had linked these the whole job
      # would pass while proving nothing.
      - name: Assert nothing is linked
        working-directory: examples/nextjs-studio
        run: |
          for dir in node_modules/@pptx-studio/*; do
            if [ -L "$dir" ]; then
              echo "::error::$dir is a symlink; this must install real tarballs"
              exit 1
            fi
          done
          node -e "console.log(require('@pptx-studio/render-svg/package.json').version)"

      - name: Typecheck
        working-directory: examples/nextjs-studio
        run: npx tsc --noEmit

      # Renders every shipped deck through the published packages and asserts
      # the slide count, the SVG shape and a clean round trip.
      - name: Smoke
        working-directory: examples/nextjs-studio
        run: npm run smoke

      - name: Build
        working-directory: examples/nextjs-studio
        run: npm run build

      # Provenance is a claim about the published artifact, so only the registry
      # can answer it, per version: one a consumer can neither verify nor be
      # warned off is the failure. ADR 0047, ADR 0051.
      - name: Every published version is attested or deprecated
        if: always()
        run: node tools/release/registry/attestations.ts

      # Counting `dist.attestations` is not verifying it. This is the check a
      # consumer would run, in a project of its own because it audits a whole
      # tree and a third-party gap is not ours to answer for. ADR 0048.
      - name: A consumer can verify every signature and attestation
        if: always()
        env:
          PACKAGES: ${{ github.workspace }}/packages
        run: |
          mkdir -p "$RUNNER_TEMP/signatures"
          cd "$RUNNER_TEMP/signatures"
          npm init -y > /dev/null
          npm install --no-audit --no-fund $(node -p "const d = process.env.PACKAGES; require('fs').readdirSync(d).map((n) => require(d + '/' + n + '/package.json')).filter((p) => !p.private).map((p) => p.name + '@latest').join(' ')")
          npm audit signatures

  # A red run becomes an issue somebody owns and the next green one closes it.
  # Its own job, with no checkout and no install, because `issues: write` must
  # never sit beside code installed from the registry. ADR 0051.
  report:
    name: an issue somebody owns
    needs: published
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: 'canary: what npm serves fails a check a consumer would run'
    steps:
      - name: Open the issue, or add this run to the one already open
        if: needs.published.result == 'failure'
        run: |
          gh label create canary --force --color b60205 \
            --description 'the daily check of @pptx-studio/* as npm serves them is red'
          open=$(gh issue list --label canary --state open --limit 1 --json number --jq '.[0].number // empty')
          today=$(date -u +%F)
          body="The daily check of @pptx-studio/* as npm serves them went red on $today; the run says which step."
          body="$body"$'\n\n'"$RUN"$'\n\n'"This blocks no release, and a release is how it gets fixed. The next green run closes this."
          if [ -z "$open" ]; then
            gh issue create --label canary --title "$TITLE" --body "$body"
          else
            gh issue comment "$open" --body "Still red on $today: $RUN"
          fi

      # `if`, never `&&`: an empty answer must not turn a green run red.
      - name: Close the issue a green run answers
        if: needs.published.result == 'success'
        run: |
          open=$(gh issue list --label canary --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "Green on $(date -u +%F): $RUN"
          fi
