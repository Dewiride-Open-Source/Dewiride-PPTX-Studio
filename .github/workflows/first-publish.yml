# One-time: create the packages on npm so trusted publishing can be configured.
#
# npm will not attach a trusted publisher to a package that does not exist yet
# - `npm trust` says so outright, and the web UI has no settings page until
# there is a package - so the first publish of a new scope cannot use OIDC.
# This job does that one publish with a short-lived token.
#
# It is deliberately a separate file rather than a flag on release.yml, because
# release.yml must never grow a token path: with a token present the npm CLI
# takes the legacy route and silently skips OIDC.
#
# DELETE THIS FILE once the eleven packages are on the registry and their
# trusted publishers are configured. It has no reason to exist after that, and
# a dispatchable token-publish job that nobody needs is a liability.
name: First publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm this writes to the public npm registry'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  first-publish:
    name: first publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Provenance is signed through Sigstore against the runner's OIDC identity,
      # so it is needed even though this job authenticates with a token.
      id-token: write
    steps:
      - name: Confirm
        if: inputs.confirm != 'publish'
        run: |
          echo "::error::type 'publish' in the confirm box to run this"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The two gates that are about the tarball rather than the code, run again
      # here because publishing is the one thing that cannot be undone.
      - run: pnpm legal
      - run: pnpm pkg:qa

      - name: Publish
        run: npm exec -- changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # changesets shells out to `npm publish` and passes no provenance flag
          # of its own, so the config is set here instead.
          NPM_CONFIG_PROVENANCE: true
