version: 2
updates:
  # Actions are pinned to SHAs, which means they cannot be updated by hand
  # without looking them up. Dependabot resolves the SHA and keeps the version
  # comment in step.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # TypeScript 7 waits for a typescript-eslint that admits it: ADR 0001's trigger, ADR 0060.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # One PR per toolchain, so a lint bump and a test bump are not two
      # separate rounds of the same CI run.
      lint:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*', 'prettier*']
      test:
        patterns: ['vitest', '@vitest/*', 'vite']
      # A Playwright bump moves Chromium and every pixel baseline with it, so it goes alone.
      browser:
        patterns: ['playwright', '@playwright/*']
      build:
        patterns: ['tsdown', 'turbo', 'typescript', 'publint', '@arethetypeswrong/*']

  # The website is npm, not pnpm, and outside the workspace, so the root entry
  # does not reach it. `@pptx-studio/*` is excluded: those ranges are written by
  # the release, and the candidate gate refuses any other hand.
  - package-ecosystem: npm
    directory: '/website'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(website)'
    ignore:
      - dependency-name: '@pptx-studio/*'
      # TypeScript 7 waits for a typescript-eslint that admits it: ADR 0001's trigger, ADR 0060.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      framework:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']
      docs:
        patterns: ['fumadocs-*', '@types/mdx', 'lucide-react']
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            '@next/eslint-plugin-next',
            'globals',
            '@types/node',
            'typescript',
          ]
      browser:
        patterns: ['playwright']
      styling:
        patterns: ['tailwindcss', '@tailwindcss/*', '@fontsource*']
